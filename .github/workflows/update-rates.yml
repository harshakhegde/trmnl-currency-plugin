name: Update forex rates

on:
  schedule:
    - cron: "5 3 * * *"
    - cron: "5 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest rates
        run: python3 generate_rates.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- current.json; then
            echo "No changes to current.json"
            exit 0
          fi
          git add current.json
          git commit -m "Update forex rates"
          git push
